aid: gain-credit
name: Gain Credit
description: 'GAIN Credit is a market-leading fintech providing responsible, AI-powered
  credit solutions for people underserved by traditional banks and lenders. The company
  combines deep financial expertise with advanced, AI-enabled credit-decisioning technology
  to offer affordable consumer lending, with funds disbursed within roughly 90 seconds
  of approval. GAIN Credit operates three consumer lending brands — Lending Stream,
  Drafty, and Afforda — serving the underserved credit market primarily in the UK,
  with operations across the US and India. Backed by QED Investors, Crosslink Capital,
  and Mohr Davidow. This corporate profile publishes no public developer API surface;
  it was surfaced as a QED Investors portfolio company and enriched by the API Evangelist
  pipeline.'
